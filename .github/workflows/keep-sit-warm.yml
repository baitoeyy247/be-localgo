name: Keep SIT API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SIT health and core APIs
        run: |
          set -euo pipefail
          BASE="https://be-localgo-ul36.onrender.com/api"
          echo "==> health"
          curl -fsS --retry 2 --max-time 60 "$BASE/health"
          echo
          echo "==> GET categories (public)"
          curl -fsS --retry 1 --max-time 90 -o /dev/null -w "time_total=%{time_total}s http=%{http_code}\n" \
            "$BASE/categories"
          echo "==> GET search/providers (public, warms geo query)"
          curl -fsS --retry 1 --max-time 90 -o /dev/null -w "time_total=%{time_total}s http=%{http_code}\n" \
            "$BASE/search/providers?lat=16.185&lng=103.302&radiusMeters=5000"
